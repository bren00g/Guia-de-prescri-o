<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nurse Master – Maceió 2026</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0f2744;
  --navy2: #1a3a5c;
  --green: #0ea472;
  --green2: #0cc07f;
  --bg: #f0f4f8;
  --card: #ffffff;
  --text: #1e2d3d;
  --muted: #64748b;
  --border: #e2e8f0;
  --red: #e53e3e;
  --amber: #d97706;
  --purple: #7c3aed;
  --teal: #0891b2;
  --pink: #db2777;
  --lime: #4d7c0f;
  --orange: #c2410c;
  --slate: #475569;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* HEADER */
.header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%);
  padding: 18px 16px 14px;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 4px 20px rgba(15,39,68,0.3);
}
.header-top {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon {
  width: 36px; height: 36px; background: var(--green);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.logo h1 { font-size: 1.2rem; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
.logo small { font-size: 0.7rem; color: rgba(255,255,255,0.6); display: block; margin-top: 1px; }
.badge {
  background: rgba(14,164,114,0.2); border: 1px solid rgba(14,164,114,0.4);
  color: var(--green2); padding: 4px 10px; border-radius: 20px;
  font-size: 0.65rem; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;
}

/* SEARCH */
.search-wrap { position: relative; }
.search-icon {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: rgba(255,255,255,0.4); font-size: 16px; pointer-events: none;
}
#searchInput {
  width: 100%; padding: 11px 16px 11px 38px;
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
  border-radius: 10px; font-size: 0.95rem; font-family: 'DM Sans', sans-serif;
  color: #fff; outline: none; transition: all 0.2s;
}
#searchInput::placeholder { color: rgba(255,255,255,0.45); }
#searchInput:focus { background: rgba(255,255,255,0.18); border-color: var(--green2); }
.clear-btn {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: rgba(255,255,255,0.5);
  font-size: 18px; cursor: pointer; display: none; padding: 2px 6px;
}

/* FILTERS */
.filter-bar {
  background: var(--card); border-bottom: 1px solid var(--border);
  padding: 10px 0 10px 16px; overflow-x: auto; display: flex; gap: 8px;
  scrollbar-width: none;
}
.filter-bar::-webkit-scrollbar { display: none; }
.filter-bar { padding-right: 16px; }
.filter-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: 20px; font-size: 0.82rem;
  font-family: 'DM Sans', sans-serif; font-weight: 500;
  white-space: nowrap; cursor: pointer; transition: all 0.18s;
  border: 1.5px solid transparent;
}
.filter-btn .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

/* RESULTS BAR */
.results-bar {
  padding: 10px 16px 6px;
  display: flex; align-items: center; justify-content: space-between;
}
.results-count {
  font-size: 0.8rem; color: var(--muted); font-weight: 500;
}
.results-count span { color: var(--navy); font-weight: 700; }

/* CARDS */
#lista { padding: 4px 16px 80px; }
.card {
  background: var(--card); border-radius: 14px;
  margin-bottom: 12px; overflow: hidden;
  box-shadow: 0 1px 4px rgba(15,39,68,0.08);
  border: 1px solid var(--border);
  transition: box-shadow 0.2s, transform 0.15s;
  animation: fadeUp 0.25s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.card-top {
  display: flex; align-items: stretch;
}
.card-stripe { width: 5px; flex-shrink: 0; }
.card-body { flex: 1; padding: 13px 14px 12px; }
.card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.card-name { font-size: 1rem; font-weight: 700; color: var(--navy); line-height: 1.2; }
.card-conc { font-family: 'DM Mono', monospace; font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
.cat-tag {
  font-size: 0.65rem; font-weight: 600; padding: 3px 8px; border-radius: 20px;
  white-space: nowrap; flex-shrink: 0; letter-spacing: 0.3px; text-transform: uppercase;
}
.info-row { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 4px; font-size: 0.85rem; }
.info-label { color: var(--muted); font-size: 0.78rem; font-weight: 500; flex-shrink: 0; min-width: 70px; }
.info-val { color: var(--text); font-size: 0.85rem; line-height: 1.35; }
.respaldo {
  margin-top: 8px; padding: 8px 10px; background: #f8fafc;
  border-radius: 8px; border-left: 3px solid #cbd5e1;
  font-size: 0.75rem; color: var(--muted); line-height: 1.4;
}
.respaldo strong { color: #475569; font-size: 0.72rem; display: block; margin-bottom: 2px; letter-spacing: 0.3px; text-transform: uppercase; }
.copy-btn {
  width: 100%; padding: 11px;
  background: var(--navy); color: #fff;
  border: none; font-family: 'DM Sans', sans-serif;
  font-size: 0.82rem; font-weight: 600; letter-spacing: 0.5px;
  cursor: pointer; transition: background 0.18s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.copy-btn:active { background: var(--green); }

/* EMPTY */
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty h3 { font-size: 1rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }

/* TOAST */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(10px);
  background: var(--navy); color: #fff; padding: 10px 22px;
  border-radius: 30px; font-size: 0.85rem; font-weight: 500;
  display: flex; align-items: center; gap: 8px;
  box-shadow: 0 8px 24px rgba(15,39,68,0.35);
  opacity: 0; transition: all 0.25s; pointer-events: none; z-index: 999;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* SECTION HEADER */
.section-header {
  padding: 14px 0 6px;
  font-size: 0.72rem; font-weight: 700; color: var(--muted);
  letter-spacing: 1px; text-transform: uppercase;
}

/* CATEGORY COLOR SYSTEM */
.c-ist { --cc: #7c3aed; }
.c-contra { --cc: #db2777; }
.c-pep { --cc: #e53e3e; }
.c-mulher { --cc: #d97706; }
.c-prenatal { --cc: #0891b2; }
.c-crianca { --cc: #16a34a; }
.c-tb { --cc: #92400e; }
.c-cronicas { --cc: #0ea472; }
.c-tabagismo { --cc: #64748b; }
.c-dengue { --cc: #ea580c; }
.c-outros { --cc: #6366f1; }

.card-stripe { background: var(--cc, #ccc); }
.cat-tag { background: color-mix(in srgb, var(--cc, #ccc) 12%, transparent); color: var(--cc, #888); border: 1px solid color-mix(in srgb, var(--cc, #ccc) 25%, transparent); }
.dot { background: var(--cc, #ccc); }

.filter-btn.active { background: var(--cc, var(--navy)); border-color: var(--cc, var(--navy)); color: #fff; }
.filter-btn.active .dot { background: rgba(255,255,255,0.8); }
.filter-btn:not(.active) { background: #f8fafc; border-color: var(--border); color: var(--muted); }
</style>
</head>

// ─── BUILD FILTERS ───────────────────────────────────────────
const catMap = {};
CATS.forEach(c => { catMap[c.id] = c; });

function cssClass(id) {
  return id === "Todos" ? "" : "c-" + id.toLowerCase();
}

const filterBar = document.getElementById("filterBar");
CATS.forEach(cat => {
  const btn = document.createElement("button");
  btn.className = "filter-btn " + cssClass(cat.id) + (cat.id === "Todos" ? " active" : "");
  btn.style.setProperty("--cc", cat.cc);
  btn.dataset.cat = cat.id;
  btn.innerHTML = `<span class="dot"></span>${cat.label}`;
  btn.addEventListener("click", () => setFilter(cat.id));
  filterBar.appendChild(btn);
});

let filtroAtivo = "Todos";

function setFilter(id) {
  filtroAtivo = id;
  document.querySelectorAll(".filter-btn").forEach(b => {
    const active = b.dataset.cat === id;
    b.classList.toggle("active", active);
  });
  renderizar();
}

// ─── SEARCH ─────────────────────────────────────────────────
const searchInput = document.getElementById("searchInput");
const clearBtn = document.getElementById("clearBtn");
searchInput.addEventListener("input", () => {
  clearBtn.style.display = searchInput.value ? "block" : "none";
  renderizar();
});
function limparBusca() {
  searchInput.value = "";
  clearBtn.style.display = "none";
  renderizar();
}

// ─── RENDER ──────────────────────────────────────────────────
function renderizar() {
  const busca = searchInput.value.toLowerCase().trim();
  const lista = document.getElementById("lista");
  const counter = document.getElementById("resultsCount");
  lista.innerHTML = "";

  const filtrados = MEDS.filter(m => {
    const matchCat = filtroAtivo === "Todos" || m.cat === filtroAtivo;
    const matchSearch = !busca ||
      m.n.toLowerCase().includes(busca) ||
      m.u.toLowerCase().includes(busca) ||
      m.c.toLowerCase().includes(busca) ||
      m.a.toLowerCase().includes(busca);
    return matchCat && matchSearch;
  });

  counter.innerHTML = `<span>${filtrados.length}</span> medicamento${filtrados.length !== 1 ? "s" : ""} encontrado${filtrados.length !== 1 ? "s" : ""}`;

  if (filtrados.length === 0) {
    lista.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><h3>Nenhum resultado</h3><p>Tente outros termos ou mude o filtro</p></div>`;
    return;
  }

  filtrados.forEach((m, i) => {
    const cat = catMap[m.cat] || { cc: "#888", label: m.cat };
    const cssC = cssClass(m.cat);
    const card = document.createElement("div");
    card.className = "card " + cssC;
    card.style.setProperty("--cc", cat.cc);
    card.style.animationDelay = Math.min(i * 0.03, 0.3) + "s";

    const nEsc = m.n.replace(/'/g, "\\'");
    const cEsc = m.c.replace(/'/g, "\\'");
    const aEsc = m.a.replace(/'/g, "\\'");
    const rEsc = m.r.replace(/'/g, "\\'");

    card.innerHTML = `
      <div class="card-top">
        <div class="card-stripe"></div>
        <div class="card-body">
          <div class="card-header">
            <div>
              <div class="card-name">${m.n}</div>
              <div class="card-conc">${m.c}</div>
            </div>
            <span class="cat-tag">${cat.label}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Apresentação</span>
            <span class="info-val">${m.a}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Indicação</span>
            <span class="info-val">${m.u}</span>
          </div>
          <div class="respaldo">
            <strong>📋 Respaldo Legal</strong>
            ${m.r}
          </div>
        </div>
      </div>
      <button class="copy-btn" onclick="copiar('${nEsc}','${cEsc}','${aEsc}','${rEsc}')">
        📋 &nbsp;COPIAR PARA O PEC
      </button>`;
    lista.appendChild(card);
  });
}

// ─── COPY ────────────────────────────────────────────────────
function copiar(n, c, a, r) {
  const texto = `${n} ${c}, ${a}.\nIndicação: —\nProtocolo: ${r}.`;
  navigator.clipboard.writeText(texto).catch(() => {
    const t = document.createElement("textarea");
    t.value = texto; document.body.appendChild(t);
    t.select(); document.execCommand("copy");
    document.body.removeChild(t);
  });
  const toast = document.getElementById("toast");
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2000);
}

renderizar();
